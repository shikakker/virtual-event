name: Runtime migration

on:
  push:
    branches:
      - ai/product-completion/virtual-event
    paths:
      - .github/workflows/runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: ai/product-completion/virtual-event
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install current lockfile
        run: yarn install --frozen-lockfile
      - name: Upgrade supported runtime
        run: |
          yarn add --exact next@15.5.24 react@18.2.0 react-dom@18.2.0
          yarn add --dev --exact typescript@5.9.2 @types/node@22.18.6 @types/react@18.3.24 @types/react-dom@18.3.7
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.engines = { node: '22.x' }
          pkg.scripts = {
            ...pkg.scripts,
            test: 'node --test tests/*.test.mjs',
            typecheck: 'tsc --noEmit',
            lint: 'eslint --ext .ts,.tsx components lib pages'
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
      - name: Runtime regression
        run: yarn test
      - name: TypeScript
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Production build
        run: yarn build
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level high
      - name: Commit verified runtime migration
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json yarn.lock tsconfig.json next-env.d.ts
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'fix: migrate virtual-event to supported runtime'
          git push origin HEAD:ai/product-completion/virtual-event
