name: Lockfile verification candidate (read-only)
on:
  push:
    branches:
      - ai/product-completion/virtual-event
    paths:
      - package.json
      - .github/workflows/lockfile-candidate.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without lifecycle scripts
        run: yarn install --ignore-scripts --non-interactive --no-progress
      - name: Check complete dependency patch
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- package.json
          node -e "const p=require('./package.json');if(p.resolutions['**/source-map-js']!=='1.2.2'||p.resolutions['**/sharp']!=='0.35.5')process.exit(1)"
          echo BEGIN_CANDIDATE_DIFF
          git diff -- yarn.lock | base64 -w0 | fold -w 3072
          echo END_CANDIDATE_DIFF
