name: Lockfile candidate (read-only)

on:
  push:
    branches: [ai/product-completion/virtual-event]
    paths: [package.json]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild candidate Yarn lock without dependency lifecycle scripts
        run: yarn install --ignore-scripts --non-interactive --no-progress
      - name: Emit lock candidate for verified manual commit
        run: |
          echo 'BEGIN_LOCKFILE_BASE64'
          base64 -w0 yarn.lock | fold -w 3072
          echo 'END_LOCKFILE_BASE64'
